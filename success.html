<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order Confirmed – Clarity</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .status-header{ display:flex; gap:12px; margin-bottom:18px; }
        .status-icon{ width:52px; height:52px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; }
        .status-icon.success{ background:#ecfdf5; color:#166534; }
        .status-header-text h1{ margin:0 0 4px; font-size:1.7rem; font-weight:800; }
        .status-header-text p{ margin:0; color:#64748b; font-size:0.98rem; }
        .status-ref{ display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; margin-bottom:16px; font-size:0.97rem; }
        .status-ref-label{ color:#64748b; }
        .status-ref-value{ font-weight:600; letter-spacing:0.03em; }
        .status-summary{ padding:14px 14px 12px; border-radius:12px; border:1px solid #edf1f5; background:#f9fafb; margin-bottom:18px; }
        .status-summary h2{ margin:0 0 10px; font-size:1.05rem; font-weight:700; }
        .status-items{ display:table; width:100%; border-collapse:separate; border-spacing:0 2px; }
        .s-line{ display:table-row; }
        .s-line-main, .s-line-qty, .s-line-price{ display:table-cell; padding:4px 0; vertical-align:baseline; }
        .s-line-main{ width:100%; }
        .s-line-name{ font-weight:600; }
        .s-line-meta{ font-size:0.85rem; color:#64748b; margin-top:2px; }
        .s-line-qty, .s-line-price{ white-space:nowrap; text-align:right; padding-left:16px; font-variant-numeric:tabular-nums; }
        .status-totals-row{ margin-top:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.95rem; }
        .status-totals-row span:first-child{ color:#64748b; }
        .status-summary-total{ margin-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:0.98rem; }
        .status-summary-total span:first-child{ color:#64748b; }
        .status-summary-total span:last-child{ font-weight:800; font-variant-numeric:tabular-nums; }
        .status-actions{ display:flex; flex-wrap:wrap; gap:10px; }
        @media (max-width:720px){
            .status-header{ align-items:flex-start; }
            .status-actions .c-btn{ flex:1 1 100%; }
        }
    </style>
</head>
<body>

<header class="site-header simple">
    <div class="bar bar-3col">
        <nav class="header-nav">
            <a href="index.html">Home</a>
            <a href="index.html#products">Shop</a>
            <a href="about.html">About</a>
            <a href="#site-footer">Contact</a>
            <a href="#" id="chatLink">Chat</a>
        </nav>

        <a class="brand" href="index.html" aria-label="Clarity home">
            <img class="brand-mark" src="/assets/images/arabic.png" alt="الوُضوح">
            <div class="brand-text">
                <span class="brand-name">CLARITY</span>
                <span class="brand-tagline">wear your truth</span>
            </div>
        </a>

        <a class="cart-link" href="cart.html" aria-label="Cart">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M7 4h-2l-1 2m0 0 2.2 8.8A2 2 0 0 0 8.1 16H18a2 2 0 0 0 1.9-1.4L22 8H5M10 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm10 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
                      fill="none" stroke="currentColor" stroke-width="1.6"
                      stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span class="cart-text">Cart</span>
            <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</header>

<main class="c-wrap" style="padding-top:32px;">
    <div class="c-card" style="padding:24px 20px 22px;">
        <div class="status-header">
            <div class="status-icon success">✓</div>
            <div class="status-header-text">
                <h1>Thank you – your order is confirmed</h1>
                <p>We’ve emailed your receipt and order details to you.</p>
            </div>
        </div>

        <div class="status-ref">
            <span class="status-ref-label">Order reference</span>
            <span id="order-ref" class="status-ref-value">Loading…</span>
        </div>

        <div class="status-summary">
            <h2>Order summary</h2>
            <div id="items" class="status-items"></div>
            <div id="totals-extra"></div>
            <div class="status-summary-total">
                <span>Total paid</span>
                <span>£<span id="total">0.00</span></span>
            </div>
        </div>

        <div class="status-actions">
            <a href="index.html" class="c-btn c-btn-primary">Continue shopping</a>
            <a href="cart.html" class="c-btn c-btn-outline">View cart</a>
        </div>
    </div>
</main>

<footer class="site-footer" id="site-footer">
    <!-- … identical footer … -->
</footer>

<div id="live" class="visually-hidden" aria-live="polite" role="status"></div>

<script>
    const params     = new URLSearchParams(window.location.search);
    const sessionId  = params.get('session_id') || params.get('sessionId') || params.get('id') || '';
    const orderRefEl = document.getElementById('order-ref');
    const itemsWrap  = document.getElementById('items');
    const totalEl    = document.getElementById('total');
    const totalsExtra= document.getElementById('totals-extra');
    const badgeEls   = document.querySelectorAll('#cart-count');

    // quick local render then clear cart
    (function renderFromLocalCart(){
        const stored = localStorage.getItem('clarityCart');
        let cart = [];
        try { cart = stored ? JSON.parse(stored) : []; } catch { cart = []; }

        if (!cart.length) {
            itemsWrap.innerHTML = '<p style="margin:0;color:#64748b;font-size:0.95rem;">Your items will be detailed in your email receipt.</p>';
            totalEl.textContent = '0.00';
        } else {
            const lines = cart.map(it => {
                const meta = [it.size, it.color].filter(Boolean).join(' / ') || '';
                const qty  = it.quantity || 1;
                const unit = Number(it.price ?? (it.priceInPence/100));
                const lineTotal = (unit * qty).toFixed(2);
                return `
          <div class="s-line">
            <div class="s-line-main">
              <div class="s-line-name">${it.name}</div>
              ${meta ? `<div class="s-line-meta">${meta}</div>` : ''}
            </div>
            <div class="s-line-qty">×${qty}</div>
            <div class="s-line-price">£${lineTotal}</div>
          </div>`;
            }).join('');
            itemsWrap.innerHTML = lines;

            const grand = cart.reduce((s, it) => {
                const unit = Number(it.price ?? (it.priceInPence/100));
                return s + unit * (it.quantity || 1);
            }, 0);
            totalEl.textContent = grand.toFixed(2);
        }

        localStorage.removeItem('clarityCart');
        badgeEls.forEach(b => b.textContent = '0');
    })();

    // ---- NEW: call Netlify function from localhost too ----
    const isLocal = location.origin.startsWith('http://localhost') || location.origin.startsWith('http://127.0.0.1');
    const FUNCTIONS_ORIGIN = isLocal ? 'https://YOUR_FUNCTIONS_SITE' : ''; // e.g. https://astonishing-empanada-8e5445.netlify.app

    (async () => {
        if (!sessionId) { orderRefEl.textContent = 'N/A'; return; }

        // temporary placeholder until the function responds
        orderRefEl.textContent = sessionId;

        try {
            const res = await fetch(
                FUNCTIONS_ORIGIN + '/.netlify/functions/retrieve-session?session_id=' + encodeURIComponent(sessionId),
                { headers: { 'Content-Type': 'application/json' } }
            );
            if (!res.ok) throw new Error('Retrieve failed: ' + res.status);

            const s = await res.json();

            if (s.orderRef) orderRefEl.textContent = s.orderRef;

            if (Array.isArray(s.items) && s.items.length) {
                const lines = s.items.map(li => {
                    const name   = li.description || 'Item';
                    const qty    = li.quantity || 1;
                    const amount = (li.amount_total ?? ((li.unit_amount ?? 0) * qty)) / 100;
                    return `
            <div class="s-line">
              <div class="s-line-main">
                <div class="s-line-name">${name}</div>
              </div>
              <div class="s-line-qty">×${qty}</div>
              <div class="s-line-price">£${amount.toFixed(2)}</div>
            </div>`;
                }).join('');
                itemsWrap.innerHTML = lines;
            }

            if (s.totals) {
                const ex = [];
                if (s.totals.subtotal != null) ex.push(`<div class="status-totals-row"><span>Subtotal</span><span>£${(s.totals.subtotal/100).toFixed(2)}</span></div>`);
                if (s.totals.shipping != null && s.totals.shipping > 0) ex.push(`<div class="status-totals-row"><span>Shipping</span><span>£${(s.totals.shipping/100).toFixed(2)}</span></div>`);
                if (s.totals.tax != null && s.totals.tax > 0) ex.push(`<div class="status-totals-row"><span>Tax</span><span>£${(s.totals.tax/100).toFixed(2)}</span></div>`);
                totalsExtra.innerHTML = ex.join('');
            } else {
                totalsExtra.innerHTML = '';
            }

            if (s.totals && s.totals.total != null) {
                totalEl.textContent = (s.totals.total / 100).toFixed(2);
            } else if (s.amount_total != null) {
                totalEl.textContent = (s.amount_total / 100).toFixed(2);
            }
        } catch (e) {
            console.warn('Could not load session details:', e);
        }
    })();
</script>

<script src="https://js.stripe.com/v3"></script>
<script src="script.js"></script>

<!-- optional Tawk loader kept as-is -->
<script>
    (function () {
        const allowed = [
            'http://localhost:63342',
            'http://127.0.0.1:63342',
            'https://stripe-functions-clarity.netlify.app',
            'https://shajidissa.github.io'
        ];
        if (!allowed.includes(location.origin)) return;
        window.Tawk_API = window.Tawk_API || {};
        window.Tawk_LoadStart = new Date();
        document.getElementById('chatLink')?.addEventListener('click', e => {
            e.preventDefault();
            if (window.Tawk_API?.maximize) Tawk_API.maximize();
        });
        var s1 = document.createElement("script");
        s1.async = true; s1.src = "https://embed.tawk.to/692073ff8af82d19645aaf59/1jajca7d2";
        s1.charset = "UTF-8"; s1.setAttribute("crossorigin", "*");
        document.body.appendChild(s1);
    })();
</script>
</body>
</html>
