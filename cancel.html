<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout Cancelled – Clarity</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Header (same as the rest of the site) -->
<header class="site-header simple">
    <div class="bar bar-3col">
        <div class="bar-left"></div>
        <a class="brand" href="index.html" aria-label="Clarity home">
            <img class="brand-mark" src="assets/images/arabic.png" alt="الوُضوح" />
            <div class="brand-text">
                <span class="brand-name">CLARITY</span>
                <span class="brand-tagline">wear your truth</span>
            </div>
        </a>
        <a class="cart-link" href="cart.html" aria-label="Cart">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M7 4h-2l-1 2m0 0 2.2 8.8A2 2 0 0 0 8.1 16H18a2 2 0 0 0 1.9-1.4L22 8H5M10 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm10 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
                      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="cart-text">Cart</span>
            <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</header>

<section class="cart" style="max-width:720px;margin:40px auto">
    <h2>Checkout cancelled</h2>
    <p>Your items are still in your cart.</p>

    <div id="preview" class="card" style="padding:16px;margin-top:16px"></div>

    <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap">
        <a href="cart.html" class="back-link">Return to cart</a>
        <a href="index.html" class="back-link">Continue shopping</a>
    </div>
</section>

<div id="live" class="visually-hidden" aria-live="polite" role="status"></div>

<script>
    // Show current cart preview & update badge without loading the full app JS
    const stored = localStorage.getItem('clarityCart');
    let cart = [];
    try { cart = stored ? JSON.parse(stored) : []; } catch(e){ cart = []; }

    const wrap = document.getElementById('preview');
    const badgeEls = document.querySelectorAll('#cart-count');

    if (!cart.length) {
        wrap.innerHTML = `<p class="muted">Your cart is empty.</p>`;
        badgeEls.forEach(b => b.textContent = '0');
    } else {
        const lines = cart.map(it => `
        <div class="cart-line" style="display:flex;justify-content:space-between;gap:12px">
          <div>
            <strong>${it.name}</strong>
            <div class="muted" style="font-size:.9rem">${[it.size, it.color].filter(Boolean).join(' / ') || ''}</div>
          </div>
          <div>×${it.quantity || 1}</div>
          <div>£${(Number(it.price) * (it.quantity || 1)).toFixed(2)}</div>
        </div>
      `).join('');
        const grand = cart.reduce((s, it) => s + Number(it.price) * (it.quantity || 1), 0);

        wrap.innerHTML = `
        ${lines}
        <div class="total" style="margin-top:12px">Current total: £${grand.toFixed(2)}</div>
      `;
        const count = cart.reduce((n, it) => n + (it.quantity || 1), 0);
        badgeEls.forEach(b => b.textContent = String(count));
    }
</script>
</body>
</html>
