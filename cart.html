<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cart – Clarity</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="site-header simple">
    <div class="bar bar-3col">
        <div class="bar-left"></div>
        <a class="brand" href="index.html" aria-label="Clarity home">
            <img class="brand-mark" src="assets/images/arabic.png" alt="الوُضوح">
            <div class="brand-text">
                <span class="brand-name">CLARITY</span>
                <span class="brand-tagline">wear your truth</span>
            </div>
        </a>
        <a class="cart-link" href="cart.html" aria-label="Cart">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M7 4h-2l-1 2m0 0 2.2 8.8A2 2 0 0 0 8.1 16H18a2 2 0 0 0 1.9-1.4L22 8H5M10 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
                      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="cart-text">Cart</span>
            <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</header>

<section class="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="total">Total: £<span id="total">0.00</span></div>

    <!-- (You can keep these fields for UX; they don't affect Stripe totals directly) -->
    <input type="email" id="customer-email" placeholder="Your email (for receipt)"/>
    <input type="text" id="coupon" placeholder="Coupon code"/>
    <button id="apply-coupon">Apply</button>

    <button id="checkout-button" hidden>Checkout</button>
</section>

<div class="whatsapp">
    <a href="https://wa.me/1234567890" target="_blank" rel="noopener">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="Chat"/>
    </a>
</div>

<div id="toast" class="toast" hidden></div>
<div id="live" class="visually-hidden" aria-live="polite" role="status"></div>

<script src="script.js"></script>
</body>
</html>
